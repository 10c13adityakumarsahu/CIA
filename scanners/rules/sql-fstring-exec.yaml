rules:
  - id: sql-fstring-exec
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = f"..."
              ...
              $CUR.execute($QUERY, ...)
          - pattern: |
              $QUERY = f"..."
              ...
              $CUR.execute($QUERY)
          - pattern: |
              $CUR.execute(f"...", ...)
          - pattern: |
              $CUR.execute(f"...")
    message: "SQL query constructed with f-string interpolation passed to cursor.execute()"
    metadata:
      cwe:
        - "CWE-89"
      owasp: "A03:2021-Injection"
    languages:
      - python
    severity: ERROR
